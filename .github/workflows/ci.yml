name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true

      - run: make lint
      - run: make test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@v3.5.0
        with:
          failure-threshold: warning
          ignore: DL3018 # apk versions churn; the base image is digest-pinned instead

      - run: make test-container

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/madhuravius/mrai
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln

  verify-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: github/gh-actions-lock@verify/v0.5.1
